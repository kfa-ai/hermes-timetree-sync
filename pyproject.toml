[project]
name = "hermes-timetree-sync"
version = "0.1.0"
description = "Managed TimeTree sync bridge for Hermes"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "KFA AI" }]
dependencies = [
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.3",
]

[project.scripts]
hermes-timetree-sync = "hermes_timetree_sync.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
